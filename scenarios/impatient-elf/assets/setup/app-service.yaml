# Front-end Service for the gift-registry app (exposes the 8000 container port as :80)
apiVersion: v1
kind: Service
metadata:
  name: gift-registry
  namespace: workshop
  labels:
    app: gift-registry
spec:
  type: ClusterIP
  selector:
    app: gift-registry
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
