# Single-replica PostgreSQL backing the gift-registry app.
# A StatefulSet is the production-correct shape for a database and gives a
# stable network identity (workshop-db) for the app to connect to.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workshop-db
  namespace: workshop
  labels:
    app: workshop-db
spec:
  serviceName: workshop-db
  replicas: 1
  selector:
    matchLabels:
      app: workshop-db
  template:
    metadata:
      labels:
        app: workshop-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: workshop-db, key: database }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: workshop-db, key: user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: workshop-db, key: password }
          volumeMounts:
            - name: workshop-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "elf_ops", "-d", "giftregistry"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: workshop-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
# The Service the app connects to (stable in-cluster endpoint: workshop-db:5432).
apiVersion: v1
kind: Service
metadata:
  name: workshop-db
  namespace: workshop
  labels:
    app: workshop-db
spec:
  type: ClusterIP
  selector:
    app: workshop-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
