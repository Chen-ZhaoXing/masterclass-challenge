---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/name: mongodb
spec:
  serviceName: "mongodb-service"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/instance: mongodb
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.2.6
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: mongodb-secret
          # TASK (step 1): Add the volumeMounts section here, inside the mongodb
          # container, mounting the claim you define below at /data/db. That is
          # MongoDB's own data directory - not the app's.

  # TASK (step 1): Add the volumeClaimTemplates section here, at this
  # indentation - level with 'template:' above, not inside it. It needs a name,
  # storageClassName, accessModes and a size. The name must match the
  # volumeMounts entry above; that name is the only thing linking the two.
