apiVersion: apps/v1
kind: Deployment
metadata:
  name: gift-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gift-tracker
  template:
    metadata:
      labels:
        app: gift-tracker
    spec:
      containers:
        - name: tracker
          image: touching/gift-tracker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: gift-tracker-config
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          # TASK (step 2): Add the volumeMounts section here, mounting YOUR
          # backup-pvc at /app/data. This is the gift-tracker app - MongoDB's
          # own storage lives in statefulset.yaml and belongs to step 1.

      # TASK (step 2): Add the volumes section here, level with 'containers:'
      # above, pointing at the PersistentVolumeClaim you create. The PVC and the
      # Service are separate documents - add them at the end of this file,
      # each after a --- separator.
