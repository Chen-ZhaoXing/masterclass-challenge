<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect width="800" height="200" fill="#0d1117"/>
  <rect x="0" y="0" width="800" height="4" fill="#c0392b"/>
  <rect x="0" y="196" width="800" height="4" fill="#c0392b"/>

  <!-- Snowflakes -->
  <text x="30"  y="50"  font-family="monospace" font-size="18" fill="#aed6f1" opacity="0.6">*</text>
  <text x="110" y="90"  font-family="monospace" font-size="14" fill="#aed6f1" opacity="0.4">*</text>
  <text x="680" y="60"  font-family="monospace" font-size="20" fill="#aed6f1" opacity="0.5">*</text>
  <text x="740" y="130" font-family="monospace" font-size="12" fill="#aed6f1" opacity="0.4">*</text>
  <text x="60"  y="160" font-family="monospace" font-size="10" fill="#aed6f1" opacity="0.3">*</text>
  <text x="760" y="170" font-family="monospace" font-size="16" fill="#aed6f1" opacity="0.5">*</text>

