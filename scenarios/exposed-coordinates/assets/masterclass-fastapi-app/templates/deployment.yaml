apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge1
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "masterclass-fastapi-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "masterclass-fastapi-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "masterclass-fastapi-app.labels" . | nindent 8 }}
    spec:
      containers:
        - name: challenge1-app
          image: "touching/masterclass-fastapi-app:latest"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # TODO: The app has been updated to read credentials from a file.
          #       It expects the path in APP_TOKEN_PATH (e.g. /app/token/credentials.key)
          #       Mount the secret as a volume and point APP_TOKEN_PATH to the file.
          env:
            - name: MODE
              value: {{ .Values.env.mode }}
            - name: APP_TOKEN
              value: {{ .Values.env.appToken }}
