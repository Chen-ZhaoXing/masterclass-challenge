apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-echo-nginx
  labels:
    {{- include "tls-client.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name _;

      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      location / {
        add_header Content-Type text/plain;
        return 200 "north-pole-secure-endpoint\n";
      }
    }
