apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-echo
  labels:
    {{- include "tls-client.labels" . | nindent 4 }}
    app: tls-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-echo
  template:
    metadata:
      labels:
        app: tls-echo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls-server
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: tls-echo-nginx
        - name: tls-server
          secret:
            secretName: tls-echo-server
