apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleigh-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sleigh-dashboard
  template:
    metadata:
      labels:
        app: sleigh-dashboard
    spec:
      containers:
        - name: dashboard
          image: python:latest
          command: ["python", "-m", "http.server", "8000"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
