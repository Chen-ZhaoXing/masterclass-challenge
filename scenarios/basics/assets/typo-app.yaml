apiVersion: app/v1
kind: Deplyoment
metadata:
  name: gift-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gift-tracker
  template:
    metadata:
      labels:
        app: gift-tracker
    spec:
      containers:
        - name: tracker
          image: nginx:1.25
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
           readinessProbe:
            httpGet:
              path: /
              port: 8080
