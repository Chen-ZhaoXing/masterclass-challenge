apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-liveness-readiness
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Liveness and readiness probes are required."
        anyPattern:
          - spec:
              containers:
                - livenessProbe:
                    httpGet:
                      path: "?*"
                  readinessProbe:
                    httpGet:
                      path: "?*"
