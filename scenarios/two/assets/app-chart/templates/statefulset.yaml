apiVersion: v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-statefulset
spec:
  serviceName: "nginx"
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
          name: nginx
      volumes:
      - name: www
        mountPath: /usr/share/nginx/html