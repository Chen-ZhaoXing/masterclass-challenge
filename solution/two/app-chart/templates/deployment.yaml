apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: backend-app
    {{- include "app-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend-app
      {{- include "app-chart.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: backend-app
        {{- include "app-chart.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:latest"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: true
            capabilities:
              drop:
              {{- toYaml .Values.securityContext.capabilities.drop | nindent 14 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
