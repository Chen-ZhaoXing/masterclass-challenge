apiVersion: v1
kind: ServiceAccount
metadata:
  name: gift-tracking-sa
  namespace: gift-tracking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gift-tracking-config-reader
  namespace: gift-tracking
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gift-tracking-config-reader
  namespace: gift-tracking
subjects:
  - kind: ServiceAccount
    name: gift-tracking-sa
    namespace: gift-tracking
roleRef:
  kind: Role
  name: gift-tracking-config-reader
  apiGroup: rbac.authorization.k8s.io
