# THE FIX — for reference / grading only (the player should arrive at this
# themselves). The elf's work moves from `containers:` to `initContainers:`,
# after wait-for-db. Init containers run sequentially, in order, and every
# one of them must exit with code 0 BEFORE the first regular container (the
# shop) is started. Guaranteed start order:
#
#   wait-for-db  →  elf (migrate + restock, exit 0)  →  gift-registry
#
# The shop can no longer open while the shelves are being restocked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gift-registry
  namespace: workshop
  labels:
    app: gift-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gift-registry
  template:
    metadata:
      labels:
        app: gift-registry
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h workshop-db -p 5432 -q; do
                echo "waiting for workshop-db:5432"; sleep 2
              done
        - name: elf
          image: newbieshine/elf:1.7.0
          env:
            - name: POSTGRES_HOST
              value: workshop-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: workshop-db, key: database }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: workshop-db, key: user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: workshop-db, key: password }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: gift-registry
          image: newbieshine/gift-registry:2.4.1
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: workshop-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: workshop-db, key: database }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: workshop-db, key: user }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: workshop-db, key: password }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
